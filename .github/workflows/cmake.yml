name: CMake CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm gcc-multilib binutils

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: >
          cmake
          --build build
          --config ${{ env.BUILD_TYPE }}
          --parallel